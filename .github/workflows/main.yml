name: Deploy Lagitakost to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # ✅ FIX HOST KEY VERIFICATION (PALING PENTING)
          ssh-keyscan -p 22 -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: |
          ssh -o StrictHostKeyChecking=no \
          -i ~/.ssh/id_ed25519 \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo 'SSH CONNECTED ✅'"

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
            cd /var/www/Lagitakost/Lagitakost
            git pull origin main
            php artisan optimize:clear
            echo "✅ Deploy selesai"
          EOF
