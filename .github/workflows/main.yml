name: Auto Deploy Lagitakost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 103.103.21.206 >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 mayosi@103.103.21.206 << 'EOF'
            cd /var/www/Lagitakost/Lagitakost

            echo "🚀 PULL REPO..."
            git pull origin main

            echo "📦 INSTALL DEPENDENCY..."
            composer install --no-interaction --prefer-dist --optimize-autoloader

            echo "🧹 CLEAR CACHE..."
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear

            echo "⚡ OPTIMIZE..."
            php artisan optimize

            echo "✅ AUTO DEPLOY SELESAI"
          EOF
